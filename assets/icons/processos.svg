<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Chip central -->
  <rect x="7" y="7" width="10" height="10" rx="1.5"/>
  <!-- Pinos esquerdos -->
  <line x1="3" y1="8" x2="7" y2="8"/>
  <line x1="3" y1="11" x2="7" y2="11"/>
  <line x1="3" y1="14" x2="7" y2="14"/>
  <line x1="3" y1="17" x2="7" y2="17"/>
  <!-- Pinos direitos -->
  <line x1="17" y1="8" x2="21" y2="8"/>
  <line x1="17" y1="11" x2="21" y2="11"/>
  <line x1="17" y1="14" x2="21" y2="14"/>
  <line x1="17" y1="17" x2="21" y2="17"/>
  <!-- Pinos superiores -->
  <line x1="8" y1="3" x2="8" y2="7"/>
  <line x1="14" y1="3" x2="14" y2="7"/>
  <line x1="11" y1="3" x2="11" y2="7"/>
  <!-- Pinos inferiores -->
  <line x1="8" y1="17" x2="8" y2="21"/>
  <line x1="14" y1="17" x2="14" y2="21"/>
  <line x1="11" y1="17" x2="11" y2="21"/>
  <!-- Círculo no centro do chip -->
  <circle cx="12" cy="12" r="2.5" />
</svg>
